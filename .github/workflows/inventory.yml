name: Refresh dealership inventory
# Inventory refresh is paused until an authorized dealership feed is configured.
# Run manually from Actions > Refresh dealership inventory when ready.
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: inventory
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory parser
        run: python -m unittest discover -s tests
      - name: Refresh inventory from dealership or approved feed
        env:
          AUTO_VERIFIED_FEED_URL: ${{ secrets.AUTO_VERIFIED_FEED_URL }}
        run: python scripts/sync_inventory.py
      - name: Save updated inventory
        run: |
          git config user.name "Auto Verified Inventory"
          git config user.email "inventory@users.noreply.github.com"
          git add web/inventory.json
          git diff --cached --quiet || git commit -m "Refresh public dealership inventory"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deploy
